name: Deploy to GitHub Pages

# the90 is the branch the project actually lives on; main has not moved since August
on:
  push:
    branches: [the90]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement flips the Pages source to "GitHub Actions" if it is not set
      # that way already, so this works whatever the repo was configured with
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # ship the tree as-is, minus git and CI plumbing, so the prototype keeps
      # living at / and the landing is served from /landing/
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          ls -la _site | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
